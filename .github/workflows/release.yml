name: Publish gem

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected version tag to RubyGems.org
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: inputs.publish && !github.event.repository.private && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify version tag
        run: ruby -r ./lib/parkes/payment_icons/version -e 'abort "Tag does not match gem version" unless ENV.fetch("GITHUB_REF_NAME") == "v#{Parkes::PaymentIcons::VERSION}"'
      - run: bundle exec rake build
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push pkg/*.gem
